name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project menutodo.xcodeproj \
            -scheme menutodo \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package app
        run: |
          cd build/Build/Products/Release
          zip -ry menutodo.zip menutodo.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: menutodo
          path: build/Build/Products/Release/menutodo.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/menutodo.zip
          generate_release_notes: true
          body: |
            ## Install

            1. Download `menutodo.zip` below
            2. Unzip and drag `menutodo.app` to `/Applications`
            3. First launch: right-click → Open (unsigned app warning), or run:
               ```bash
               xattr -dr com.apple.quarantine /Applications/menutodo.app
               ```
            4. App appears in your menu bar

            ## Claude Code skill

            ```
            /plugin marketplace add starc007/menutodo
            /plugin install menutodo
            ```
